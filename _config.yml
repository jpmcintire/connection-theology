title: Connection Theology
tagline: A theology with nothing to take on faith.
description: A derivation, from two sentences and one act, of what a mind is, what it owes, and what love is — with the lab half machine-checked in Lean 4.
url: https://connectiontheology.org
author: John McIntire
theme: jekyll-theme-minimal
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
# 11-20-26: the exclude and include lists that stood here both named lean/CT.lean and
# lean/lean-toolchain. Under GitHub Pages' Jekyll the exclude won, so the site never served
# either file and the front page's link to the Lean file was dead. With no exclude, both are
# copied to the site as they are.
# jekyll-sitemap writes /sitemap.xml at every build. robots.txt points to it.
plugins:
  - jekyll-sitemap

collections:
  daily:
    output: true
    permalink: /daily/:name/
future: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Superseded versions stay public and reachable, and are left out of the sitemap so that
  # a search engine is pointed at the current papers.
  - scope:
      path: "archive"
    values:
      sitemap: false
